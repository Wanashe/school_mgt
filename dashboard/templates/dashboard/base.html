<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Management Dashboard{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; min-height: 100vh; background: #f4f6f9; }
        .sidebar { width: 240px; background: #2c3e50; color: #ecf0f1; padding: 20px; }
        .sidebar h2 { font-size: 20px; margin-bottom: 20px; color: #3498db; }
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 12px; }
        .sidebar a { color: #ecf0f1; text-decoration: none; font-size: 15px; }
        .sidebar a:hover { color: #3498db; }
        .main-content { flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { color: #7f8c8d; font-size: 14px; margin-bottom: 10px; }
        .card p { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>School Mgt</h2>
        <ul>
            <li><a href="{% url 'dashboard_redirect' %}">Dashboard</a></li>
            <li><a href="{% url 'academics_home' %}">Academics</a></li>
            {% block sidebar_nav %}{% endblock %}
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
            <div>
                <span>Welcome, <strong>{{ request.user.username }}</strong> ({{ request.user.get_role_display }})</span>
                <form action="{% url 'logout' %}" method="post" style="display:inline; margin-left: 15px;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
